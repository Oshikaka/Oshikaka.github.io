# Content for the "Work Experience" and "Education" sections of the home page.
# Rendered by _includes/background.liquid, toggled in the front matter of _pages/about.md.
#
# Each entry supports:
#   title, institution, url, department, location, year
#   institutions  list of { name, url, location, year } for entries that span
#                 more than one campus or site
#   logo          file name inside assets/img/logos/
#   logo_height   overrides the default logo height (e.g. 3.4rem)
#   logo_offset   nudges the logo up or down (e.g. -1rem)
#   description   list of bullet points
#   notes         list of { text, logo, logo_alt, logo_url }, each shown as its
#                 own line with the logo inline at the end
#   partners      list of { name, logo, url, height, width } shown as a logo row
#   partners_label  overrides the "In collaboration with" label
#
# `awards` and `professional_service` are flat lists of { year, label, text, url }.

